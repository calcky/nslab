name: CI and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_NO_PROGRESS: "1"

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify runner architecture
        run: test "$(uname -m)" = x86_64
      - name: Sync development environment
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check src tests
      - name: Check formatting
        run: uv run ruff format --check src tests
      - name: Type check
        run: uv run mypy src
      - name: Build documentation
        run: uv run --with-requirements docs/requirements.txt mkdocs build --strict
      - name: Validate lock file
        run: uv lock --check
      - name: Build Python package
        run: uv build

  tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify runner architecture
        run: test "$(uname -m)" = x86_64
      - name: Sync test environment
        run: uv sync --locked --python "${{ matrix.python-version }}"
      - name: Run non-root tests
        run: TMPDIR=/tmp uv run pytest -q -m "not root"

  root-integration:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify runner architecture
        run: test "$(uname -m)" = x86_64
      - name: Install Linux networking tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bpftool clang jq libbpf-dev iproute2 iputils-ping frr frr-pythontools
          sudo systemctl disable --now frr.service || true
      - name: Sync integration environment
        run: uv sync --locked --python 3.12
      - name: Compile XDP example
        run: make -C examples/xdp
      - name: Run supported root integration tests
        run: |
          sudo env TMPDIR=/tmp "$GITHUB_WORKSPACE/.venv/bin/pytest" \
            tests/integration -q -m root \
            --ignore=tests/integration/test_bridge_fdb_e2e_root.py
      - name: Smoke-test IPv4 forwarding topology
        run: |
          set -euo pipefail
          run_suffix="${GITHUB_RUN_ID: -10}"
          smoke_name="ipv4-fwd-${run_suffix}-${GITHUB_RUN_ATTEMPT}"
          nslab_bin="$GITHUB_WORKSPACE/.venv/bin/nslab"
          topology="$GITHUB_WORKSPACE/examples/ipv4-forward/nslab.yaml"
          cleanup() {
            sudo env TMPDIR=/tmp /usr/bin/timeout 30 "$nslab_bin" destroy \
              --topo "$topology" --name "$smoke_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          sudo env TMPDIR=/tmp /usr/bin/timeout 30 "$nslab_bin" deploy \
            --topo "$topology" --name "$smoke_name"
          sudo env TMPDIR=/tmp /usr/bin/timeout 30 "$nslab_bin" exec \
            --name "$smoke_name" --node r1 -- \
            /usr/bin/cat /proc/sys/net/ipv4/ip_forward | grep -Fx "1"
          sudo env TMPDIR=/tmp /usr/bin/timeout 30 "$nslab_bin" exec \
            --name "$smoke_name" --node h1 -- \
            /usr/bin/ping -c 1 -W 2 198.51.100.2
          sudo env TMPDIR=/tmp /usr/bin/timeout 30 "$nslab_bin" destroy \
            --topo "$topology" --name "$smoke_name"
          trap - EXIT
      - name: Smoke-test XDP actions
        run: |
          set -euo pipefail
          run_suffix="${GITHUB_RUN_ID: -10}"
          smoke_name="xdp-${run_suffix}-${GITHUB_RUN_ATTEMPT}"
          nslab_bin="$GITHUB_WORKSPACE/.venv/bin/nslab"
          topology="$GITHUB_WORKSPACE/examples/xdp/nslab.yaml"
          object="$GITHUB_WORKSPACE/examples/xdp/xdp_lab.o"
          cleanup() {
            sudo env TMPDIR=/tmp /usr/bin/timeout 30 "$nslab_bin" destroy \
              --topo "$topology" --name "$smoke_name" >/dev/null 2>&1 || true
          }
          attach() {
            local section="$1"
            sudo env TMPDIR=/tmp /usr/bin/timeout 30 "$nslab_bin" exec \
              --name "$smoke_name" --node xdp1 -- \
              /usr/sbin/ip link set dev eth0 xdpgeneric object "$object" section "$section"
          }
          detach() {
            sudo env TMPDIR=/tmp /usr/bin/timeout 30 "$nslab_bin" exec \
              --name "$smoke_name" --node xdp1 -- \
              /usr/sbin/ip link set dev eth0 xdpgeneric off
          }
          ping_from_h1() {
            local destination="$1"
            sudo env TMPDIR=/tmp /usr/bin/timeout 30 "$nslab_bin" exec \
              --name "$smoke_name" --node h1 -- \
              /usr/bin/ping -c 1 -W 2 "$destination"
          }
          trap cleanup EXIT
          sudo env TMPDIR=/tmp /usr/bin/timeout 30 "$nslab_bin" deploy \
            --topo "$topology" --name "$smoke_name"

          attach xdp/pass
          ping_from_h1 10.40.1.254
          detach

          attach xdp/drop
          if ping_from_h1 10.40.1.254; then
            echo "XDP_DROP unexpectedly allowed ICMP" >&2
            exit 1
          fi
          detach

          attach xdp/tx
          ping_from_h1 10.40.1.254
          detach

          sudo env TMPDIR=/tmp /usr/bin/timeout 30 "$nslab_bin" exec \
            --name "$smoke_name" --node xdp1 -- \
            /usr/bin/ping -c 1 -W 2 10.40.2.2
          attach xdp/redirect
          ping_from_h1 10.40.2.2
          sudo /usr/sbin/bpftool -j map lookup name nslab_xdp_stats \
            key hex 04 00 00 00 | /usr/bin/jq -e '.value > 0'

          sudo env TMPDIR=/tmp /usr/bin/timeout 30 "$nslab_bin" destroy \
            --topo "$topology" --name "$smoke_name"
          trap - EXIT
      - name: Smoke-test OSPF and BGP daemons
        run: |
          set -euo pipefail
          run_suffix="${GITHUB_RUN_ID: -10}"
          nslab_bin="$GITHUB_WORKSPACE/.venv/bin/nslab"
          smoke_routing() (
            set -euo pipefail
            local protocol="$1"
            local topology="$2"
            local check_node="$3"
            local smoke_name="${protocol}-${run_suffix}-${GITHUB_RUN_ATTEMPT}"

            cleanup() {
              sudo env TMPDIR=/tmp /usr/bin/timeout 30 "$nslab_bin" destroy \
                --topo "$topology" --name "$smoke_name" >/dev/null 2>&1 || true
            }
            trap cleanup EXIT

            run_vtysh() {
              local node="$1"
              local command="$2"
              sudo env TMPDIR=/tmp /usr/bin/timeout 30 "$nslab_bin" exec \
                --name "$smoke_name" --node "$node" -- \
                /usr/bin/vtysh -N "nslab-${smoke_name}-${node}" -c "$command"
            }

            # RIB convergence can precede ARP/FIB readiness on fresh links.
            wait_for_ping() {
              local node="$1"
              local destination="$2"
              local deadline=$((SECONDS + 15))
              local output=""
              while (( SECONDS < deadline )); do
                if output="$(
                  sudo env TMPDIR=/tmp /usr/bin/timeout 30 "$nslab_bin" exec \
                    --name "$smoke_name" --node "$node" -- \
                    /usr/bin/ping -c 1 -W 2 "$destination" 2>&1
                )"; then
                  printf '%s\n' "$output"
                  return 0
                fi
                sleep 1
              done
              echo "ICMP connectivity did not become ready: ${node} -> ${destination}" >&2
              printf '%s\n' "$output" >&2
              return 1
            }

            wait_for_ospf() {
              local deadline=$((SECONDS + 45))
              local output route_output
              while (( SECONDS < deadline )); do
                if output="$(run_vtysh "$check_node" "show ip ospf neighbor" 2>/dev/null)"; then
                  if grep -Eq '(^|[[:space:]])Full([/[:space:]]|$)' <<<"$output"; then
                    if route_output="$(run_vtysh "$check_node" "show ip route ospf" 2>/dev/null)" \
                      && grep -Fq "192.0.3.0/24" <<<"$route_output"; then
                      printf '%s\n%s\n' "$output" "$route_output"
                      return 0
                    fi
                  fi
                fi
                sleep 1
              done
              echo "OSPF neighbors did not reach Full on ${check_node}" >&2
              run_vtysh "$check_node" "show ip ospf neighbor" || true
              return 1
            }

            wait_for_bgp() {
              local deadline=$((SECONDS + 45))
              local output
              while (( SECONDS < deadline )); do
                if output="$(run_vtysh "$check_node" "show ip bgp summary" 2>/dev/null)"; then
                  # FRR prints a numeric PfxRcd value only for an established
                  # session; require both expected peers to have received data.
                  if awk -f "$GITHUB_WORKSPACE/scripts/ci/bgp-summary-ready.awk" \
                    <<<"$output"; then
                    printf '%s\n' "$output"
                    return 0
                  fi
                fi
                sleep 1
              done
              echo "BGP peers did not establish on ${check_node}" >&2
              run_vtysh "$check_node" "show ip bgp summary" || true
              return 1
            }

            case "$protocol" in
              ospf)
                sudo env TMPDIR=/tmp /usr/bin/timeout 60 "$nslab_bin" deploy \
                  --topo "$topology" --name "$smoke_name"
                wait_for_ospf
                wait_for_ping h1 192.0.3.2
                ;;
              bgp)
                sudo env TMPDIR=/tmp /usr/bin/timeout 60 "$nslab_bin" deploy \
                  --topo "$topology" --name "$smoke_name"
                wait_for_bgp
                run_vtysh "$check_node" "show ip bgp" \
                  | grep -F "198.18.1.0/24"
                run_vtysh "$check_node" "show ip bgp" \
                  | grep -F "198.18.3.0/24"
                wait_for_ping h1 198.18.3.2
                ;;
              *) echo "unsupported protocol: $protocol" >&2; return 2 ;;
            esac
            sudo env TMPDIR=/tmp /usr/bin/timeout 30 "$nslab_bin" destroy \
              --topo "$topology" --name "$smoke_name"
            trap - EXIT
          )
          smoke_routing ospf "$GITHUB_WORKSPACE/examples/ospf/nslab.yaml" r1
          smoke_routing bgp "$GITHUB_WORKSPACE/examples/bgp/nslab.yaml" r2

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - checks
      - tests
      - root-integration
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify runner architecture
        run: test "$(uname -m)" = x86_64
      - name: Install Linux networking tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iputils-ping zsh
      - name: Sync release environment
        run: uv sync --locked --group release --python 3.12
      - name: Verify release version matches tag
        run: |
          package_version="$(uv run python -c 'from nslab import __version__; print(__version__)')"
          test "$package_version" = "${GITHUB_REF_NAME#v}"
      - name: Build standalone executable
        run: |
          commit_file="$RUNNER_TEMP/nslab-commit"
          printf '%s\n' "$GITHUB_SHA" > "$commit_file"
          uv run --group release pyinstaller \
            --clean --noconfirm --onefile --name nslab \
            --copy-metadata nslab \
            --add-data "$commit_file:nslab" \
            src/nslab/__main__.py
          file dist/nslab
          file dist/nslab | grep -F "ELF 64-bit LSB"
          file dist/nslab | grep -F "x86-64"
      - name: Smoke-test packaged CLI
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          test "$(./dist/nslab --version)" = \
            "nslab ${GITHUB_REF_NAME#v} (commit $short_sha)"
          ./dist/nslab --help >/dev/null
          ./dist/nslab completion bash | bash -n
          ./dist/nslab completion zsh | zsh -n
          ./dist/nslab graph --topo examples/bridge-fdb/nslab.yaml \
            | grep -F "Topology: bridge-fdb"
      - name: Smoke-test packaged network lifecycle
        run: |
          set -euo pipefail
          smoke_name="release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            sudo ./dist/nslab destroy \
              --topo examples/bridge-fdb/nslab.yaml \
              --name "$smoke_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          sudo ./dist/nslab deploy \
            --topo examples/bridge-fdb/nslab.yaml \
            --name "$smoke_name"
          sudo ./dist/nslab exec \
            --name "$smoke_name" \
            --node h1 -- /usr/bin/ping -c 1 10.10.0.2
          sudo ./dist/nslab inspect --name "$smoke_name" \
            | grep -F "status: deployed"
          sudo ./dist/nslab destroy \
            --topo examples/bridge-fdb/nslab.yaml \
            --name "$smoke_name"
          trap - EXIT
      - name: Package release assets
        id: package
        run: |
          archive="nslab-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          mkdir -p release-package
          install -m 0755 dist/nslab release-package/nslab
          tar -C release-package -czf "dist/$archive" nslab
          (cd dist && sha256sum "$archive" > SHA256SUMS)
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              "dist/$ARCHIVE" dist/SHA256SUMS --clobber
          else
            gh release create "$TAG_NAME" \
              "dist/$ARCHIVE" dist/SHA256SUMS \
              --verify-tag --generate-notes --title "$TAG_NAME"
          fi
