version: 1
name: qdisc

topology:
  nodes:
    h1:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.60.1.1/24]
    h2:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.60.1.2/24]
    h3:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.60.2.1/24]
    h4:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.60.2.2/24]
    h5:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.60.3.1/24]
    h6:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.60.3.2/24]
  links:
    - endpoints: [h1:eth0, h2:eth0]
      netem:
        rate: 10mbit
        delay_ms: 20
        jitter_ms: 5
        loss_percent: 1
    - endpoints: [h3:eth0, h4:eth0]
      qdisc:
        kind: tbf
        rate: 5mbit
        burst: 32kb
        latency_ms: 400
    - endpoints: [h5:eth0, h6:eth0]
      qdisc:
        kind: fq_codel
        target_ms: 5
        interval_ms: 100
        limit: 10240
        ecn: true
