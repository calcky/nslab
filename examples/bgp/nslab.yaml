version: 1
name: bgp

topology:
  nodes:
    h1:
      kind: linux
      interfaces:
        eth0:
          addresses: [198.18.1.2/24]
      routes:
        - dst: 198.18.3.0/24
          via: 198.18.1.1
          dev: eth0

    r1:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.1.12.1/30]
        eth1:
          addresses: [198.18.1.1/24]
      sysctls:
        net.ipv4.ip_forward: 1
      routing:
        bgp:
          local_as: 65001
          router_id: 1.1.1.1
          neighbors:
            - address: 10.1.12.2
              remote_as: 65002
          networks:
            - 198.18.1.0/24

    r2:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.1.12.2/30]
        eth1:
          addresses: [10.1.23.1/30]
      sysctls:
        net.ipv4.ip_forward: 1
      routing:
        bgp:
          local_as: 65002
          router_id: 2.2.2.2
          neighbors:
            - address: 10.1.12.1
              remote_as: 65001
            - address: 10.1.23.2
              remote_as: 65003

    r3:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.1.23.2/30]
        eth1:
          addresses: [198.18.3.1/24]
      sysctls:
        net.ipv4.ip_forward: 1
      routing:
        bgp:
          local_as: 65003
          router_id: 3.3.3.3
          neighbors:
            - address: 10.1.23.1
              remote_as: 65002
          networks:
            - 198.18.3.0/24

    h2:
      kind: linux
      interfaces:
        eth0:
          addresses: [198.18.3.2/24]
      routes:
        - dst: 198.18.1.0/24
          via: 198.18.3.1
          dev: eth0

  links:
    - endpoints: [h1:eth0, r1:eth1]
    - endpoints: [r1:eth0, r2:eth0]
    - endpoints: [r2:eth1, r3:eth0]
    - endpoints: [r3:eth1, h2:eth0]
