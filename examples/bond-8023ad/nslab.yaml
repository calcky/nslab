version: 1
name: bond-8023ad

topology:
  nodes:
    h1:
      kind: linux
      interfaces:
        eth0: {}
        eth1: {}
      devices:
        bond0:
          type: bond
          mode: 802.3ad
          interfaces: [eth0, eth1]
          addresses: [10.61.0.1/24]
          miimon_ms: 100
          lacp_rate: fast
          xmit_hash_policy: layer3+4
          min_links: 1

    h2:
      kind: linux
      interfaces:
        eth0: {}
        eth1: {}
      devices:
        bond0:
          type: bond
          mode: 802.3ad
          interfaces: [eth0, eth1]
          addresses: [10.61.0.2/24]
          miimon_ms: 100
          lacp_rate: fast
          xmit_hash_policy: layer3+4
          min_links: 1

  links:
    - endpoints: [h1:eth0, h2:eth0]
    - endpoints: [h1:eth1, h2:eth1]
