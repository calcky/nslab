version: 1
name: pim

topology:
  nodes:
    source:
      kind: linux
      interfaces:
        eth0:
          addresses: [192.0.1.2/24]
      routes:
        - dst: default
          via: 192.0.1.1
          dev: eth0
        - dst: 224.0.0.0/4
          dev: eth0

    r1:
      kind: linux
      interfaces:
        eth0:
          addresses: [192.0.1.1/24]
        eth1:
          addresses: [10.0.12.1/30]
      sysctls:
        net.ipv4.ip_forward: 1
      routing:
        ospf:
          router_id: 1.1.1.1
          networks:
            - 192.0.1.0/24
            - 10.0.12.0/30
          passive_interfaces: [eth0]
        pim:
          rp_address: 10.255.0.2
          interfaces: [eth0, eth1]

    r2:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.0.12.2/30]
        eth1:
          addresses: [10.0.23.1/30]
      devices:
        rp0:
          type: dummy
          addresses: [10.255.0.2/32]
      sysctls:
        net.ipv4.ip_forward: 1
      routing:
        ospf:
          router_id: 2.2.2.2
          networks:
            - 10.0.12.0/30
            - 10.0.23.0/30
            - 10.255.0.2/32
          passive_interfaces: [rp0]
        pim:
          rp_address: 10.255.0.2
          interfaces: [eth0, eth1, rp0]

    r3:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.0.23.2/30]
        eth1:
          addresses: [192.0.31.1/24]
        eth2:
          addresses: [192.0.32.1/24]
      sysctls:
        net.ipv4.ip_forward: 1
      routing:
        ospf:
          router_id: 3.3.3.3
          networks:
            - 10.0.23.0/30
            - 192.0.31.0/24
            - 192.0.32.0/24
          passive_interfaces: [eth1, eth2]
        pim:
          rp_address: 10.255.0.2
          interfaces: [eth0, eth1, eth2]
          igmp_interfaces: [eth1, eth2]

    receiver1:
      kind: linux
      interfaces:
        eth0:
          addresses: [192.0.31.2/24]
      routes:
        - dst: default
          via: 192.0.31.1
          dev: eth0
        - dst: 224.0.0.0/4
          dev: eth0

    receiver2:
      kind: linux
      interfaces:
        eth0:
          addresses: [192.0.32.2/24]
      routes:
        - dst: default
          via: 192.0.32.1
          dev: eth0
        - dst: 224.0.0.0/4
          dev: eth0

  links:
    - endpoints: [source:eth0, r1:eth0]
    - endpoints: [r1:eth1, r2:eth0]
    - endpoints: [r2:eth1, r3:eth0]
    - endpoints: [r3:eth1, receiver1:eth0]
    - endpoints: [r3:eth2, receiver2:eth0]
