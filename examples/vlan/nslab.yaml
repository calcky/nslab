version: 1
name: vlan

topology:
  nodes:
    h1:
      kind: linux
      interfaces:
        eth0: {}
      devices:
        vlan10:
          type: vlan
          link: eth0
          id: 10
          addresses: [192.168.10.3/24]
      routes:
        - dst: default
          via: 192.168.10.1
          dev: vlan10

    h2:
      kind: linux
      interfaces:
        eth0: {}
      devices:
        vlan10:
          type: vlan
          link: eth0
          id: 10
          addresses: [192.168.10.4/24]
      routes:
        - dst: default
          via: 192.168.10.1
          dev: vlan10

    h10:
      kind: linux
      interfaces:
        eth0:
          addresses: [192.168.10.2/24]
      routes:
        - dst: default
          via: 192.168.10.1
          dev: eth0

    sw1:
      kind: bridge
      bridge:
        name: br0
        stp: false
        vlan_filtering: true
        ports:
          trunk1:
            vlans:
              - vid: 10
          trunk2:
            vlans:
              - vid: 10
          access10:
            vlans:
              - vid: 10
                pvid: true
                untagged: true
          router:
            vlans:
              - vid: 10
              - vid: 20
          access20:
            vlans:
              - vid: 20
                pvid: true
                untagged: true

    r1:
      kind: linux
      interfaces:
        eth0: {}
      devices:
        vlan10:
          type: vlan
          link: eth0
          id: 10
          addresses: [192.168.10.1/24]
        vlan20:
          type: vlan
          link: eth0
          id: 20
          addresses: [192.168.20.1/24]
      sysctls:
        net.ipv4.ip_forward: 1

    h20:
      kind: linux
      interfaces:
        eth0:
          addresses: [192.168.20.2/24]
      routes:
        - dst: default
          via: 192.168.20.1
          dev: eth0

  links:
    - endpoints: [h1:eth0, sw1:trunk1]
    - endpoints: [h2:eth0, sw1:trunk2]
    - endpoints: [h10:eth0, sw1:access10]
    - endpoints: [sw1:router, r1:eth0]
    - endpoints: [sw1:access20, h20:eth0]
