version: 1
name: netem

topology:
  nodes:
    h1:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.30.0.1/24]
    h2:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.30.0.2/24]
  links:
    - endpoints: [h1:eth0, h2:eth0]
      mtu: 1500
      netem:
        delay_ms: 100
        jitter_ms: 10
        loss_percent: 5
