version: 1
name: virtual-devices

topology:
  nodes:
    h1:
      kind: linux
      interfaces:
        eth0:
          addresses: [192.0.2.1/24]
        eth1:
          addresses: [198.51.100.1/24]
      devices:
        dummy0:
          type: dummy
          mtu: 1400
          addresses: [203.0.113.1/32]
        mac0:
          type: macvlan
          link: eth0
          mode: bridge
          addresses: [192.0.2.10/24]
        ip0:
          type: ipvlan
          link: eth1
          mode: l3
          addresses: [198.51.100.10/24]
    h2:
      kind: linux
      interfaces:
        eth0:
          addresses: [192.0.2.2/24]
    h3:
      kind: linux
      interfaces:
        eth0:
          addresses: [198.51.100.2/24]
  links:
    - endpoints: [h1:eth0, h2:eth0]
    - endpoints: [h1:eth1, h3:eth0]
