version: 1
name: pmtu

topology:
  nodes:
    h1:
      kind: linux
      interfaces:
        eth0:
          addresses:
            - 192.0.2.2/24
            - 2001:db8:1::2/64
      routes:
        - dst: 198.51.100.0/24
          via: 192.0.2.1
          dev: eth0
        - dst: 2001:db8:3::/64
          via: 2001:db8:1::1
          dev: eth0

    r1:
      kind: linux
      interfaces:
        eth0:
          addresses:
            - 192.0.2.1/24
            - 2001:db8:1::1/64
        eth1:
          addresses:
            - 10.0.12.1/30
            - 2001:db8:12::1/64
      routes:
        - dst: 198.51.100.0/24
          via: 10.0.12.2
          dev: eth1
        - dst: 2001:db8:3::/64
          via: 2001:db8:12::2
          dev: eth1
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv6.conf.all.forwarding: 1

    r2:
      kind: linux
      interfaces:
        eth0:
          addresses:
            - 10.0.12.2/30
            - 2001:db8:12::2/64
        eth1:
          addresses:
            - 198.51.100.1/24
            - 2001:db8:3::1/64
      routes:
        - dst: 192.0.2.0/24
          via: 10.0.12.1
          dev: eth0
        - dst: 2001:db8:1::/64
          via: 2001:db8:12::1
          dev: eth0
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv6.conf.all.forwarding: 1

    h2:
      kind: linux
      interfaces:
        eth0:
          addresses:
            - 198.51.100.2/24
            - 2001:db8:3::2/64
      routes:
        - dst: 192.0.2.0/24
          via: 198.51.100.1
          dev: eth0
        - dst: 2001:db8:1::/64
          via: 2001:db8:3::1
          dev: eth0

  links:
    - endpoints: [h1:eth0, r1:eth0]
      mtu: 1500
    - endpoints: [r1:eth1, r2:eth0]
      mtu: 1280
    - endpoints: [r2:eth1, h2:eth0]
      mtu: 1500
