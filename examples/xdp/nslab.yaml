version: 1
name: xdp

topology:
  nodes:
    h1:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.40.1.1/24]
      routes:
        - dst: 10.40.2.0/24
          via: 10.40.1.254
          dev: eth0
    xdp1:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.40.1.254/24]
        eth1:
          addresses: [10.40.2.254/24]
      sysctls:
        net.ipv4.ip_forward: 1
    h2:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.40.2.2/24]
      routes:
        - dst: 10.40.1.0/24
          via: 10.40.2.254
          dev: eth0
  links:
    - endpoints: [h1:eth0, xdp1:eth0]
      mtu: 1500
    - endpoints: [xdp1:eth1, h2:eth0]
      mtu: 1500
