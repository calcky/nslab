version: 1
name: bpf-path
topology:
  nodes:
    h1:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.72.1.1/24]
      routes:
        - dst: 10.72.2.0/24
          via: 10.72.1.254
          dev: eth0
    r1:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.72.1.254/24]
        eth1:
          addresses: [10.72.2.254/24]
      sysctls:
        net.ipv4.ip_forward: 1
    h2:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.72.2.2/24]
      routes:
        - dst: 10.72.1.0/24
          via: 10.72.2.254
          dev: eth0
  links:
    - endpoints: [h1:eth0, r1:eth0]
    - endpoints: [r1:eth1, h2:eth0]
