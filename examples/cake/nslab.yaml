version: 1
name: cake

topology:
  nodes:
    h1:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.61.0.1/24]
    h2:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.61.0.2/24]
  links:
    - endpoints: [h1:eth0, h2:eth0]
      qdisc:
        kind: cake
        bandwidth: 20mbit
        flow_mode: flows
        diffserv_mode: besteffort
        rtt_ms: 100
        nat: false
