version: 1
name: ospf

topology:
  nodes:
    h1:
      kind: linux
      interfaces:
        eth0:
          addresses: [192.0.1.2/24]
      routes:
        - dst: 192.0.3.0/24
          via: 192.0.1.1
          dev: eth0

    r1:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.0.12.1/30]
        eth1:
          addresses: [10.0.13.1/30]
        eth2:
          addresses: [192.0.1.1/24]
      sysctls:
        net.ipv4.ip_forward: 1
      routing:
        ospf:
          router_id: 1.1.1.1
          networks:
            - 10.0.12.0/30
            - 10.0.13.0/30
            - 192.0.1.0/24
          passive_interfaces: [eth2]

    r2:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.0.12.2/30]
        eth1:
          addresses: [10.0.23.1/30]
      sysctls:
        net.ipv4.ip_forward: 1
      routing:
        ospf:
          router_id: 2.2.2.2
          networks:
            - 10.0.12.0/30
            - 10.0.23.0/30

    r3:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.0.23.2/30]
        eth1:
          addresses: [10.0.13.2/30]
        eth2:
          addresses: [192.0.3.1/24]
      sysctls:
        net.ipv4.ip_forward: 1
      routing:
        ospf:
          router_id: 3.3.3.3
          networks:
            - 10.0.23.0/30
            - 10.0.13.0/30
            - 192.0.3.0/24
          passive_interfaces: [eth2]

    h2:
      kind: linux
      interfaces:
        eth0:
          addresses: [192.0.3.2/24]
      routes:
        - dst: 192.0.1.0/24
          via: 192.0.3.1
          dev: eth0

  links:
    - endpoints: [h1:eth0, r1:eth2]
    - endpoints: [r1:eth0, r2:eth0]
    - endpoints: [r2:eth1, r3:eth0]
    - endpoints: [r3:eth1, r1:eth1]
    - endpoints: [r3:eth2, h2:eth0]
