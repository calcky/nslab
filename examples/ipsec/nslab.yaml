version: 1
name: ipsec
topology:
  nodes:
    h1:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.90.1.2/24]
      routes:
        - dst: 10.90.2.0/24
          via: 10.90.1.1
          dev: eth0
    r1:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.90.1.1/24]
        eth1:
          addresses: [192.0.2.1/30]
      routes:
        - dst: 10.90.2.0/24
          via: 192.0.2.2
          dev: eth1
      sysctls:
        net.ipv4.ip_forward: 1
    r2:
      kind: linux
      interfaces:
        eth0:
          addresses: [192.0.2.2/30]
        eth1:
          addresses: [10.90.2.1/24]
      routes:
        - dst: 10.90.1.0/24
          via: 192.0.2.1
          dev: eth0
      sysctls:
        net.ipv4.ip_forward: 1
    h2:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.90.2.2/24]
      routes:
        - dst: 10.90.1.0/24
          via: 10.90.2.1
          dev: eth0
  links:
    - endpoints: [h1:eth0, r1:eth0]
    - endpoints: [r1:eth1, r2:eth0]
    - endpoints: [r2:eth1, h2:eth0]
