version: 1
name: vxlan

topology:
  nodes:
    h1:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.70.0.1/24]

    vtep1:
      kind: bridge
      interfaces:
        underlay0:
          addresses: [192.0.2.1/24]
      devices:
        vxlan100:
          type: vxlan
          vni: 100
          link: underlay0
          local: 192.0.2.1
          remote: 192.0.2.2
      bridge:
        name: br0
        stp: false
        vlan_filtering: false

    vtep2:
      kind: bridge
      interfaces:
        underlay0:
          addresses: [192.0.2.2/24]
      devices:
        vxlan100:
          type: vxlan
          vni: 100
          link: underlay0
          local: 192.0.2.2
          remote: 192.0.2.1
      bridge:
        name: br0
        stp: false
        vlan_filtering: false

    h2:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.70.0.2/24]

    h3:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.80.1.1/24]
      routes:
        - dst: 10.80.2.0/24
          via: 10.80.1.254
          dev: eth0

    r1:
      kind: linux
      interfaces:
        lan0:
          addresses: [10.80.1.254/24]
        underlay0:
          addresses: [192.0.2.3/24]
      devices:
        vxlan200:
          type: vxlan
          vni: 200
          link: underlay0
          local: 192.0.2.3
          remote: 192.0.2.4
          addresses: [10.255.200.1/30]
      routes:
        - dst: 10.80.2.0/24
          via: 10.255.200.2
          dev: vxlan200
      sysctls:
        net.ipv4.ip_forward: 1

    r2:
      kind: linux
      interfaces:
        underlay0:
          addresses: [192.0.2.4/24]
        lan0:
          addresses: [10.80.2.254/24]
      devices:
        vxlan200:
          type: vxlan
          vni: 200
          link: underlay0
          local: 192.0.2.4
          remote: 192.0.2.3
          addresses: [10.255.200.2/30]
      routes:
        - dst: 10.80.1.0/24
          via: 10.255.200.1
          dev: vxlan200
      sysctls:
        net.ipv4.ip_forward: 1

    h4:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.80.2.2/24]
      routes:
        - dst: 10.80.1.0/24
          via: 10.80.2.254
          dev: eth0

    underlay:
      kind: bridge
      bridge:
        name: br0
        stp: false
        vlan_filtering: false

  links:
    - endpoints: [underlay:p1, vtep1:underlay0]
      mtu: 1500
    - endpoints: [underlay:p2, vtep2:underlay0]
      mtu: 1500
    - endpoints: [underlay:p3, r1:underlay0]
      mtu: 1500
    - endpoints: [underlay:p4, r2:underlay0]
      mtu: 1500
    - endpoints: [h1:eth0, vtep1:access0]
      mtu: 1450
    - endpoints: [vtep2:access0, h2:eth0]
      mtu: 1450
    - endpoints: [h3:eth0, r1:lan0]
    - endpoints: [r2:lan0, h4:eth0]
