version: 1
name: drop-diagnosis
topology:
  nodes:
    h1:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.73.1.1/24]
          mac: 02:00:00:73:01:01
      neighbors:
        - dst: 10.73.1.254
          dev: eth0
          lladdr: 02:00:00:73:01:fe
          state: permanent
      routes:
        - dst: 10.73.2.0/24
          via: 10.73.1.254
          dev: eth0
    r1:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.73.1.254/24]
          mac: 02:00:00:73:01:fe
        eth1:
          addresses: [10.73.2.254/24]
          mac: 02:00:00:73:02:fe
      neighbors:
        - dst: 10.73.1.1
          dev: eth0
          lladdr: 02:00:00:73:01:01
          state: permanent
        - dst: 10.73.2.2
          dev: eth1
          lladdr: 02:00:00:73:02:02
          state: permanent
      sysctls:
        net.ipv4.ip_forward: 1
    h2:
      kind: linux
      interfaces:
        eth0:
          addresses: [10.73.2.2/24]
          mac: 02:00:00:73:02:02
      neighbors:
        - dst: 10.73.2.254
          dev: eth0
          lladdr: 02:00:00:73:02:fe
          state: permanent
      routes:
        - dst: 10.73.1.0/24
          via: 10.73.2.254
          dev: eth0
  links:
    - endpoints: [h1:eth0, r1:eth0]
    - endpoints: [r1:eth1, h2:eth0]
