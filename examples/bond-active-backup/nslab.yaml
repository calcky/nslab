version: 1
name: bond-active-backup

topology:
  nodes:
    h1:
      kind: linux
      interfaces:
        eth0: {}
        eth1: {}
      devices:
        bond0:
          type: bond
          mode: active-backup
          interfaces: [eth0, eth1]
          addresses: [10.60.0.1/24]
          miimon_ms: 100
          primary: eth0

    h2:
      kind: linux
      interfaces:
        eth0: {}
        eth1: {}
      devices:
        bond0:
          type: bond
          mode: active-backup
          interfaces: [eth0, eth1]
          addresses: [10.60.0.2/24]
          miimon_ms: 100
          primary: eth0

  links:
    - endpoints: [h1:eth0, h2:eth0]
    - endpoints: [h1:eth1, h2:eth1]
