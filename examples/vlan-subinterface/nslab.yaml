version: 1
name: vlan-subinterface

topology:
  nodes:
    h1:
      kind: linux
      interfaces:
        eth0: {}
      devices:
        vlan10:
          type: vlan
          link: eth0
          id: 10
          addresses: [192.0.2.1/24]

    h2:
      kind: linux
      interfaces:
        eth0: {}
      devices:
        vlan10:
          type: vlan
          link: eth0
          id: 10
          addresses: [192.0.2.2/24]

  links:
    - endpoints: [h1:eth0, h2:eth0]
