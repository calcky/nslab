site_name: nslab
site_description: Declarative Linux network namespace labs
site_url: https://nslab.readthedocs.io/en/latest/
repo_name: calcky/nslab
repo_url: https://github.com/calcky/nslab
edit_uri: edit/main/docs/

exclude_docs: |
  **/plans/**
  **/specs/**
  requirements.txt

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: true
          site_description: 声明式 Linux network namespace 实验工具
          nav_translations:
            Home: 首页
            Getting started: 快速开始
            CLI reference: CLI 参考
            Examples: 实验示例
            Overview: 示例索引
            Layer 2 switching: 二层交换
            IP forwarding: IP 转发
            Link conditions: 链路条件
            Dynamic routing: 动态路由
            IPv4 forwarding: IPv4 转发
            IPv6 forwarding: IPv6 转发
          theme:
            palette:
              - media: "(prefers-color-scheme: light)"
                scheme: default
                toggle:
                  icon: material/weather-sunny
                  name: 切换到深色模式
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                toggle:
                  icon: material/weather-night
                  name: 切换到浅色模式

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Manifest: manifest.md
  - CLI reference: cli.md
  - Examples:
      - Overview: examples/index.md
      - Layer 2 switching:
          - Bridge FDB: examples/bridge-fdb.md
          - Bridge VLAN: examples/bridge-vlan.md
          - Bridge STP: examples/bridge-stp.md
      - IP forwarding:
          - IPv4 forwarding: examples/ipv4-forward.md
          - IPv6 forwarding: examples/ipv6-forward.md
      - Link conditions:
          - netem: examples/netem.md
      - Dynamic routing:
          - OSPF: examples/ospf.md
          - BGP: examples/bgp.md

strict: true
