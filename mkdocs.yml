site_name: nslab
site_description: Declarative Linux network namespace labs
site_url: https://nslab.readthedocs.io/en/latest/
repo_name: calcky/nslab
repo_url: https://github.com/calcky/nslab
edit_uri: edit/main/docs/

exclude_docs: |
  **/plans/**
  **/specs/**
  requirements.txt

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: true
          site_description: 声明式 Linux network namespace 实验工具
          nav_translations:
            Home: 首页
            Getting started: 快速开始
            CLI reference: CLI 参考
            Examples: 实验示例
            Overview: 示例索引
            Layer 2 switching: 二层交换
            Namespace interfaces: Namespace 接口
            Tunnel devices: 隧道设备
            Link aggregation: 链路聚合
            IP forwarding: IP 转发
            Routing isolation: 路由域隔离
            Link conditions: 链路条件
            Packet processing: 数据包处理
            Dynamic routing: 动态路由
            Bridge port controls: Bridge 端口控制
            IPv4 forwarding: IPv4 转发
            IPv6 forwarding: IPv6 转发
            Neighbor tables: 邻居表
            ECMP multipath routing: ECMP 等价多路径路由
            VLAN: VLAN 子接口与单臂路由
            Bond overview: Bond 概览
            Bond active-backup: Bond 主备模式
            Bond 802.3ad: Bond 802.3ad
            Linux VRF: Linux VRF
            Policy routing: 策略路由
            XDP receive and transmit: XDP 收发包
            VXLAN: 二层与三层 VXLAN
            Geneve: Geneve 二层 overlay
            Virtual devices: 虚拟设备
            GRE and IPIP: GRE 与 IPIP
          theme:
            palette:
              - media: "(prefers-color-scheme: light)"
                scheme: default
                toggle:
                  icon: material/weather-sunny
                  name: 切换到深色模式
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                toggle:
                  icon: material/weather-night
                  name: 切换到浅色模式

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Manifest: manifest.md
  - CLI reference: cli.md
  - Examples:
      - Overview: examples/index.md
      - Layer 2 switching:
          - Bridge FDB: examples/bridge-fdb.md
          - Bridge port controls: examples/bridge-port-controls.md
          - Bridge VLAN: examples/bridge-vlan.md
          - VLAN: examples/vlan.md
          - Bridge STP: examples/bridge-stp.md
          - VXLAN: examples/vxlan.md
          - Geneve: examples/geneve.md
      - Namespace interfaces:
          - Virtual devices: examples/virtual-devices.md
      - Tunnel devices:
          - GRE and IPIP: examples/ip-tunnels.md
      - Link aggregation:
          - Bond overview: examples/bond.md
          - Bond active-backup: examples/bond-active-backup.md
          - Bond 802.3ad: examples/bond-8023ad.md
      - IP forwarding:
          - IPv4 forwarding: examples/ipv4-forward.md
          - IPv6 forwarding: examples/ipv6-forward.md
          - Neighbor tables: examples/neighbors.md
          - ECMP multipath routing: examples/ecmp.md
      - Routing isolation:
          - Linux VRF: examples/vrf.md
          - Policy routing: examples/policy-routing.md
      - Link conditions:
          - netem: examples/netem.md
          - qdisc: examples/qdisc.md
      - Packet processing:
          - XDP receive and transmit: examples/xdp.md
      - Dynamic routing:
          - OSPF: examples/ospf.md
          - BGP: examples/bgp.md

strict: true
